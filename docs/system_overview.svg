<g font-size="21" font-weight="700">
<text x="150" y="183">Flutter 앱</text>
<text x="580" y="183">FastAPI 서버</text>
<text x="1010" y="183">Gemini</text>
<text x="432" y="362">기억 · 관계</text>
<text x="727" y="362">세션 저장</text>
<text x="140" y="628">선택 · 규칙 계산</text>
<text x="390" y="628">장면 후보 생성</text>
<text x="630" y="628">후보 검수</text>
<text x="965" y="603">결과 확정 · 저장</text>
<text x="965" y="748">후보 적용 중단</text>
</g>
<g font-size="16" fill="#46566b">
<text x="150" y="217">선택 전달 · 장면과 상태 표시</text>
<text x="580" y="217">규칙 실행 · 생성 및 검수 조율</text>
<text x="1010" y="217">서술 생성 · 의미 판정</text>
<text x="432" y="391">4계층 기억 · 관계 하이퍼그래프</text>
<text x="727" y="391">확정 상태 보관 · 재개</text>
<text x="140" y="657">필요한 정산 결과</text>
<text x="390" y="657">현재 상태와 경험 참고</text>
<text x="630" y="657">구조 · 참조 · 의미</text>
<text x="965" y="637">새 장면과 상태를 앱에 전달</text>
<text x="965" y="782">이전 확정 장면·상태 유지 및 복구</text>
</g>
<g font-size="16" fill="#526276">
<text x="360" y="162">REST · SSE</text>
<text x="360" y="232">요청 / 상태·장면 응답</text>
<text x="800" y="162">모델 요청</text>
<text x="800" y="232">생성 후보 · 판정</text>
<text x="425" y="284">조회 · 경험 반영</text>
<text x="733" y="284">저장 · 재개</text>
</g>
</g>
<line x1="40" y1="495" x2="1120" y2="495" stroke="#cbd5e1"/>
<text x="40" y="535" font-size="22" font-weight="700">일반 미확정 행동의 처리와 경험 재활용</text>
<text x="40" y="917" font-size="15" fill="#526276">이미 확정된 전투 결과 등은 별도 경로로 처리하며, 서술 복구 과정에서 중복 계산하지 않는다.</text>
</g>
