<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="950" viewBox="0 0 1160 950" role="img" aria-labelledby="title desc">
<title id="title">Hallucination 시스템 구성과 행동 처리</title>
<desc id="desc">Flutter 앱은 REST와 SSE로 FastAPI 서버와 통신한다. 서버가 Gemini 호출, 기억과 관계, 확정 세션 저장을 연결한다. 일반 미확정 행동은 계산과 생성 뒤 검수를 거쳐 확정하거나 이전 상태를 유지하며, 축적한 경험은 이후 생성에 다시 사용한다.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2563a6"/></marker>
</defs>
<rect width="1160" height="950" rx="16" fill="#f8fafc"/>
<g font-family="Malgun Gothic, sans-serif" fill="#17283e">
<text x="40" y="48" font-size="26" font-weight="700">Hallucination · 시스템 구성과 행동 처리</text>
<text x="40" y="82" font-size="16" fill="#526276">클라이언트는 입력과 표시를, 서버는 실행·모델 호출·확정 상태를 관리한다.</text>
<rect x="280" y="108" width="600" height="357" rx="16" fill="#f0f4f8" stroke="#c2cedb" stroke-dasharray="6 4"/>
<text x="305" y="444" font-size="15" fill="#526276">서버 측 처리 · 기억 관리 · 저장</text>
<g stroke="#aab8c9" stroke-width="1.5" fill="#fff">
<rect x="40" y="145" width="220" height="100" rx="12"/>
<rect x="460" y="145" width="240" height="100" rx="12"/>
<rect x="900" y="145" width="220" height="100" rx="12"/>
<rect x="310" y="325" width="245" height="90" rx="12" fill="#edf5ff" stroke="#81a7d4"/>
