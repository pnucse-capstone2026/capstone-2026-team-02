<rect x="540" y="590" width="180" height="90" rx="12"/>
<rect x="810" y="565" width="310" height="95" rx="12" fill="#edf8f1" stroke="#83ad93"/>
<rect x="810" y="710" width="310" height="95" rx="12" fill="#fff4ec" stroke="#d0a78a"/>
</g>
